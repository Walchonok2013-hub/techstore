{% load static %}
{% load user_carts %}

<!-- Кнопка вызова корзины -->
<div class="cart-trigger">
    <button type="button" class="btn btn-dark d-flex align-items-center" id="cartModalButton"
            data-bs-toggle="modal" data-bs-target="#cartModal"
            aria-expanded="false" aria-controls="cartModal">
        <img class="mx-1" src="{% static 'deps/icons/basket2-fill.svg' %}" alt="Корзина" width="24" height="24">
        <span id="goodsInCartCount">
            {% user_cart_count as cart_count %}
            {{ cart_count }}
        </span>
    </button>
</div>

<!-- Разметка модального окна корзины -->
<div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="cartModalLabel">Корзина</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="cartContent">
                    <!-- Содержимое корзины будет загружено через AJAX -->
                    <div class="text-center text-muted">
                Загрузка содержимого корзины...
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const cartModal = document.getElementById('cartModal');
    const cartContent = document.getElementById('cartContent');
    const cartCountSpan = document.getElementById('goodsInCartCount');

    if (!cartModal || !cartContent) return;

    // Слушаем событие открытия модального окна Bootstrap
    cartModal.addEventListener('show.bs.modal', (event) => {
        // Блокируем кнопку, чтобы не было дублей запросов
        const triggerBtn = event.relatedTarget;
        const originalText = triggerBtn.innerHTML;
        triggerBtn.disabled = true;
        triggerBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Загрузка...';

        // AJAX-запрос к представлению, которое отдаёт HTML корзины
        fetch('/cart/modal/') // <-- ВАЖНО: укажи здесь правильный URL твоего view
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сети');
                return response.text();
            })
            .then(html => {
                cartContent.innerHTML = html;
                // Опционально: можно обновить счётчик, если view вернёт JSON с count
            })
            .catch(error => {
                console.error('Ошибка загрузки корзины:', error);
                cartContent.innerHTML = '<div class="alert alert-danger">Не удалось загрузить корзину. Обновите страницу.</div>';
            })
            .finally(() => {
                // Возвращаем кнопку в исходное состояние
                triggerBtn.disabled = false;
                triggerBtn.innerHTML = originalText;
            });
    });
});
</script>
